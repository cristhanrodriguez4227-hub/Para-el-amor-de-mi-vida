<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Día de los Carritos Hot Wheels 🏎️✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020208;
            color: white;
            user-select: none;
        }
        /* Pantalla de Inicio Cinemática */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #0d0e25 0%, #020205 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-start {
            background: linear-gradient(45deg, #ff0055, #ff5500);
            border: none;
            padding: 18px 40px;
            color: white;
            font-size: 1.3rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.6);
            transition: 0.3s;
            animation: pulse 2s infinite;
            letter-spacing: 1px;
        }
        .btn-start:hover {
            transform: scale(1.05);
            box-shadow: 0 0 45px rgba(255, 85, 0, 0.9);
        }
        /* Capa de Interfaz de Usuario */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px;
            z-index: 10;
        }
        .title {
            font-size: 2rem;
            font-weight: 900;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
            animation: neon 2.5s ease-in-out infinite alternate;
        }
        /* Canvas de Renderizado 3D */
        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        /* Botón de la Carta */
        .card-trigger {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 15px 35px;
            border-radius: 50px;
            color: white;
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
            transition: all 0.4s ease;
        }
        .card-trigger:hover {
            background: rgba(255, 0, 85, 0.2);
            border-color: #ff0055;
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(255, 0, 85, 0.4);
        }
        /* Carta de Amor con Efecto de Cristal Neón */
        #love-card {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 90%;
            max-width: 420px;
            background: rgba(6, 10, 30, 0.85);
            border: 1px solid rgba(255, 0, 85, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 35px 25px;
            box-shadow: 0 0 40px rgba(255, 0, 85, 0.25), inset 0 0 20px rgba(255, 255, 255, 0.05);
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }
        #love-card.active {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.8rem;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.5);
            transition: 0.3s;
        }
        .close-btn:hover {
            color: #ff0055;
        }
        .card-text {
            line-height: 1.8;
            font-size: 1.1rem;
            margin-top: 20px;
            color: #e2e2ff;
            font-weight: 500;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 0, 85, 0.5); }
            50% { transform: scale(1.03); box-shadow: 0 0 40px rgba(255, 0, 85, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 0, 85, 0.5); }
        }
        @keyframes neon {
            from { text-shadow: 0 0 10px rgba(255,255,255,0.8), 0 0 20px #ff0055, 0 0 30px #ff0055; }
            to { text-shadow: 0 0 5px rgba(255,255,255,0.8), 0 0 15px #00d2ff, 0 0 25px #00d2ff; }
        }
    </style>

    <script src="https://cloudflare.com"></script>
</head>

    </div>

            dirLight.position.set(0, 10, 20);
            scene.add(dirLight);
