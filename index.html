<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Día de los Carritos Hot Wheels 🏎️✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020208;
            color: white;
        }

        /* Pantalla de Bienvenida */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #0a0a23 0%, #020208 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 1s ease;
        }

        .btn-start {
            background: linear-gradient(45deg, #ff0055, #ff5500);
            border: none;
            padding: 15px 35px;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
            animation: pulse 1.5s infinite;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Contenedor Principal */
        #main-content {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            background: radial-gradient(circle at center, #0b112c 0%, #020205 100%);
        }

        .title {
            font-size: 1.8rem;
            text-align: center;
            margin-top: 20px;
            text-shadow: 0 0 10px #00d2ff, 0 0 20px #00d2ff;
            color: #fff;
            animation: neon 2s ease-in-out infinite alternate;
            z-index: 5;
        }

        /* Escenario de la Galaxia */
        #galaxy-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 1000px;
            height: 100%;
            width: 100%;
            pointer-events: none;
        }

        .car-particle {
            position: absolute;
            font-size: 24px;
            filter: drop-shadow(0 0 8px rgba(0, 210, 255, 0.8));
            transition: all 2.5s cubic-bezier(0.25, 1, 0.5, 1);
            transform: translate(-50%, -50%);
            opacity: 0.8;
        }

        /* Ventana Emergente de la Carta */
        .card-trigger {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 12px 25px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            z-index: 5;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: 0.3s;
        }

        .card-trigger:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        #love-card {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.7);
            width: 90%;
            max-width: 400px;
            background: rgba(10, 15, 45, 0.95);
            border: 2px solid #ff0055;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.4);
            z-index: 8;
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s ease;
            text-align: center;
        }

        #love-card.active {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #ff0055;
        }

        .card-text {
            line-height: 1.6;
            font-size: 1.05rem;
            margin-top: 15px;
            color: #e0e0ff;
        }

        /* Animaciones */
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 0, 85, 0.6); }
            50% { transform: scale(1.05); box-shadow: 0 0 35px rgba(255, 0, 85, 0.9); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 0, 85, 0.6); }
        }

        @keyframes neon {
            from { text-shadow: 0 0 10px #fff, 0 0 20px #ff0055, 0 0 30px #ff0055; }
            to { text-shadow: 0 0 5px #fff, 0 0 15px #00d2ff, 0 0 25px #00d2ff; }
        }
    </style>
</head>
<body>

    <!-- REPRODUCTOR DE AUDIO (Pon aquí la música de fondo que quieras) -->
    <audio id="bg-music" loop>
        <source src="https://soundhelix.com" type="audio/mp3">
    </audio>

    <!-- PANTALLA DE INICIO -->
    <div id="welcome-screen">
        <button class="btn-start" onclick="startExperience()">
            <span>⚡ Toca para iniciar</span>
        </button>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <div id="main-content">
        <h1 class="title">Feliz Día de los Carritos Hot Wheels 🏎️✨</h1>
        
        <div id="galaxy-container"></div>

        <button class="card-trigger" onclick="toggleCard()">Abrir Mensaje Especial ❤️</button>
    </div>

    <!-- CARTA DE AMOR -->
    <div id="love-card">
        <span class="close-btn" onclick="toggleCard()">&times;</span>
        <h2 style="color: #ff0055; margin-bottom: 10px;">Para Mi Novio Mío 👇❤️</h2>
        <p class="card-text">
            Hay personas que llegan y sin darse cuenta, hacen que tus días sean mejores. Por eso, este detalle es para ti.<br><br>
            ¡Gracias por cada momento compartido! Eres mi persona favorita en todo el universo entero. 🌌🏎️
        </p>
    </div>

    <script>
        const cars = ['🏎️', '🚗', '🚙', '🏎️', '⚡', '✨', '💙', '⭐'];
        const container = document.getElementById('galaxy-container');
        const totalParticles = 60;
        let particles = [];

        // Inicializar partículas en posiciones aleatorias de galaxia
        function initGalaxy() {
            for (let i = 0; i < totalParticles; i++) {
                const el = document.createElement('div');
                el.className = 'car-particle';
                el.innerText = cars[Math.floor(Math.random() * cars.length)];
                container.appendChild(el);
                
                // Configuración inicial dispersa en forma espiral
                const angle = (i / totalParticles) * Math.PI * 8;
                const radius = 5 + (i * 4);
                const x = window.innerWidth / 2 + Math.cos(angle) * radius;
                const y = window.innerHeight / 2 + Math.sin(angle) * radius;

                el.style.left = `${x}px`;
                el.style.top = `${y}px`;
                
                particles.push({ element: el, baseAngle: angle, baseRadius: radius, index: i });
            }
        }

        // Transición de figuras mecánicas (Galaxia -> Corazón -> Constelación)
        let currentShape = 0; 
        function transformGalaxy() {
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;

            particles.forEach((p) => {
                let targetX, targetY;

                if (currentShape === 0) {
                    // Forma: Corazón gigante
                    const t = (p.index / totalParticles) * Math.PI * 2;
                    targetX = centerX + 16 * Math.pow(Math.sin(t), 3) * 12;
                    targetY = centerY - (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * 12;
                } else if (currentShape === 1) {
                    // Forma: Órbita dispersa limpia
                    const angle = p.baseAngle + 0.5;
                    targetX = centerX + Math.cos(angle) * (p.baseRadius * 1.2);
                    targetY = centerY + Math.sin(angle) * (p.baseRadius * 1.2);
                } else {
                    // Forma: Coche Estelar abstracto
                    const progress = p.index / totalParticles;
                    targetX = centerX + (progress - 0.5) * 350;
                    targetY = centerY + Math.sin(progress * Math.PI * 3) * 60;
                }

                p.element.style.left = `${targetX}px`;
                p.element.style.top = `${targetY}px`;
            });

            currentShape = (currentShape + 1) % 3;
        }

        function startExperience() {
            document.getElementById('welcome-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('welcome-screen').style.display = 'none';
            }, 1000);

            // Iniciar Audio Seguro
            const music = document.getElementById('bg-music');
            music.play().catch(err => console.log("Audio esperando interacción"));

            initGalaxy();
            // Cambia de forma dinámicamente cada 3 segundos
            setInterval(transformGalaxy, 3000);
        }

        function toggleCard() {
            document.getElementById('love-card').classList.toggle('active');
        }

        // Reajustar si la pantalla cambia de tamaño
        window.addEventListener('resize', () => {
            if(particles.length > 0) transformGalaxy();
        });
    </script>
</body>
</html>
